services:
  backend:
    build:
      context: ./backend
    image: musicflow-backend:latest
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      TZ: Asia/Shanghai
      MUSIC_SOURCE_DIR: /music/source
      MUSIC_OUTPUT_DIR: /music/output
      MUSIC_ARCHIVE_DIR: /music/archive
      CONFIG_DIR: /config
      LOGS_DIR: /logs
      TEMP_DIR: /temp
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      MAX_CONCURRENT_TASKS: 2
      FFMPEG_THREADS: 2
      FILE_STABLE_SECONDS: 30
    volumes:
      - ./config:/config
      - ./logs:/logs
      - ./temp:/temp
      - ${MUSIC_SOURCE_PATH:-./data/source}:/music/source
      - ${MUSIC_OUTPUT_PATH:-./data/output}:/music/output
      - ${MUSIC_ARCHIVE_PATH:-./data/archive}:/music/archive
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    image: musicflow-frontend:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
