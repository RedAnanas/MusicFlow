services:
  musicflow:
    build: .
    image: musicflow:latest
    container_name: musicflow
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DATA_DIR: /data
      CONFIG_DIR: /data/config
      LOGS_DIR: /data/logs
      TEMP_DIR: /data/temp
      MUSIC_SOURCE_DIR: /music
    volumes:
      # 配置、任务历史、日志、临时文件及自动安装的 FFmpeg。
      - ./data:/data
      # 用户通过界面选择的所有音乐目录应位于此根目录内。
      - ./music:/music
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
